[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "structio"
version = "1.0.0"
description = "Generate website information architectures from reusable site profiles."
requires-python = ">=3.11"
dependencies = [
    "rich>=14.0.0",
]

[project.scripts]
structio = "structio.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
